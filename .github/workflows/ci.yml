name: CI

on:
  workflow_call:

permissions:
  contents: read


jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@733de629b521477102822ccfcc855427de2f2b08
    with:
      python-version: '3.11'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Build package
        run: uv build
      - name: Test the source distribution
        run: |
          .venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tarfile
          from tempfile import TemporaryDirectory

          archives = list(Path("dist").glob("*.tar.gz"))
          if len(archives) != 1:
              raise RuntimeError("Expected one source distribution")
          with TemporaryDirectory(prefix="dbus-event-log-sdist-") as directory:
              with tarfile.open(archives[0]) as archive:
                  archive.extractall(directory, filter="data")
              project = next(Path(directory).iterdir())
              environment = dict(os.environ, PYTHONPATH=str(project / "src"))
              subprocess.run(
                  [sys.executable, "-m", "pytest", "-q"],
                  cwd=project,
                  env=environment,
                  check=True,
              )
          PY
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

    timeout-minutes: 30
  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: |
            ghcr.io/victron-venus/dbus-event-log:ci
            ghcr.io/victron-venus/dbus-event-log:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify monitoring on an isolated session bus
        run: |
          docker run --rm \
            --mount "type=bind,source=$PWD/tests/smoke_monitor.py,target=/tmp/smoke_monitor.py,readonly" \
            --entrypoint dbus-run-session \
            ghcr.io/victron-venus/dbus-event-log:${{ github.sha }} \
            -- python /tmp/smoke_monitor.py
    timeout-minutes: 30
