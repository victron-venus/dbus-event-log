name: CI

on:
  workflow_call:

permissions:
  contents: read


jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@5f5ff3846aacee0edfbeadeb316ee68525e9208d # main
    with:
      python-version: '3.11'

  build:
    name: Build
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    needs: ci
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Build package
        run: uv build
      - name: Test the source distribution
        run: |
          .venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tarfile
          from tempfile import TemporaryDirectory

          archives = list(Path("dist").glob("*.tar.gz"))
          if len(archives) != 1:
              raise RuntimeError("Expected one source distribution")
          with TemporaryDirectory(prefix="dbus-event-log-sdist-") as directory:
              with tarfile.open(archives[0]) as archive:
                  archive.extractall(directory, filter="data")
              project = next(Path(directory).iterdir())
              environment = dict(os.environ, PYTHONPATH=str(project / "src"))
              subprocess.run(
                  [sys.executable, "-m", "pytest", "-q"],
                  cwd=project,
                  env=environment,
                  check=True,
              )
          PY
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

    timeout-minutes: 30
  docker:
    name: Native container packaging
    needs: build
    # Release runs exercise this exact adapter after validation with the allocated plan.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: ./.github/workflows/native-container-check.yml
