name: CI

on:
  workflow_call:

permissions:
  contents: read


jobs:
  ci:
    name: CI
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/python-ci.yml@559a10117d8831ee03ec0fcd195d6bf3716a7c11 # main
    with:
      use-uv-lock: true
      dependency-extras: "dev"
      build-dependency-group: build
      python-version: '3.11'
      coverage-threshold: 80
      test-args: tests/ .github/workflow-tests/ .github/release-tests/

  build:
    name: Build
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    needs: ci
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
      - name: Install dependencies
        run: |
          uv sync --locked --only-group build --no-install-workspace --no-install-local --no-build
          uv sync --locked --extra dev --group build --no-build-isolation
      - name: Build package
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          .venv/bin/python -m build --no-isolation
          .venv/bin/python -m build --no-isolation --wheel --outdir /tmp/dbus-event-log-repeat
          cmp dist/*.whl /tmp/dbus-event-log-repeat/*.whl
      - name: Test the source distribution
        run: |
          .venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tarfile
          from tempfile import TemporaryDirectory

          archives = list(Path("dist").glob("*.tar.gz"))
          if len(archives) != 1:
              raise RuntimeError("Expected one source distribution")
          with TemporaryDirectory(prefix="dbus-event-log-sdist-") as directory:
              with tarfile.open(archives[0]) as archive:
                  archive.extractall(directory, filter="data")
              project = next(Path(directory).iterdir())
              environment = dict(os.environ, PYTHONPATH=str(project / "src"))
              subprocess.run(
                  [sys.executable, "-m", "pytest", "-q"],
                  cwd=project,
                  env=environment,
                  check=True,
              )
          PY
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

    timeout-minutes: 30
  docker:
    name: Native container packaging
    needs: build
    # Release runs exercise this exact adapter after validation with the allocated plan.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: ./.github/workflows/native-container-check.yml

  build-flags:
    name: Native compiler flags (${{ matrix.arch }})
    needs: ci
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Audit outbound calls on the supported community runner
        if: ${{ matrix.arch == 'amd64' }}
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up native container builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify real compiler and linker inputs
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: python3 tests/native_build_flags.py --platform "$NATIVE_PLATFORM" --output build-flag-evidence
      - name: Upload native flag proof and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-build-flags-${{ matrix.arch }}
          path: build-flag-evidence/
          if-no-files-found: error
          retention-days: 30
