name: Native container validation
'on':
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    name: Freeze validation-only package identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Create local plan without allocating or publishing a release
      id: plan
      env:
        EXPECTED_SOURCE_SHA: ${{ github.sha }}
      shell: bash
      run: |
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path
        import subprocess
        import sys

        root = Path.cwd()
        sys.path.insert(0, str(root / "scripts"))
        import version_plan

        # The public pure API never contacts GitHub or changes release state.
        # beta.1 is a disposable validation identity, not an allocated sequence.
        subprocess.run(["git", "diff", "--exit-code", "HEAD", "--"], check=True)
        source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
        policy = json.loads((root / ".release-policy.json").read_text())
        base = version_plan.read_base_version(root, policy)
        version_plan.check_base_versions(root, policy, base)
        plan = version_plan.create_plan(base, "beta", 1, source, policy)
        version_plan.validate_plan(plan, policy, os.environ["EXPECTED_SOURCE_SHA"])
        version_plan.verify_checkout(root, policy, plan)
        with (root / ".release-plan.json").open("x", encoding="utf-8") as output:
            output.write(version_plan.json_bytes(plan).decode() + "\n")
        with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
            output.write(f"version={base}\n")
        print(f"Validation-only plan for {source}; no release identity allocated or published.")
        PY
    - name: Store validation plan for this run and attempt
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: native-check-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: .release-plan.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
  build:
    name: Validate exact native release packaging
    needs: plan
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      channel: beta
      release_plan_artifact: native-check-plan-${{ github.run_id }}-${{ github.run_attempt }}
