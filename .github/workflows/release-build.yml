name: Build Release Candidate
'on':
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
      release_plan_artifact:
        description: Frozen version plan artifact allocated by the release workflow
        required: true
        type: string
permissions:
  contents: read
jobs:
  native-container:
    name: Native container (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          platform: linux/amd64
          runner: ubuntu-24.04
        - arch: arm64
          platform: linux/arm64
          runner: ubuntu-24.04-arm
    steps:
    - name: Audit outbound calls on the supported community runner
      if: ${{ matrix.arch == 'amd64' }}
      uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
    - name: Download frozen release version plan
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.release_plan_artifact }}
        path: .
    - name: Apply frozen release version inputs
      run: python3 scripts/version_plan.py sync --root . --plan .release-plan.json
    - name: Set up native container builder
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build and smoke test the native OCI image
      env:
        NATIVE_PLATFORM: ${{ matrix.platform }}
        NATIVE_ARCH: ${{ matrix.arch }}
      run: bash scripts/build-native-container.sh "$NATIVE_PLATFORM" "native-container-$NATIVE_ARCH"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: native-container-${{ matrix.arch }}-${{ github.run_attempt }}
        path: native-container-${{ matrix.arch }}/*
        if-no-files-found: error
        compression-level: 0
        retention-days: 7
  package:
    needs: native-container
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Audit outbound calls
      uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
    - name: Download frozen release version plan
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.release_plan_artifact }}
        path: .
    - name: Apply frozen release version inputs
      shell: bash
      run: python3 scripts/version_plan.py sync --root . --plan .release-plan.json
    - name: Install package build tools
      run: 'python3 -m pip install --require-hashes --only-binary=:all: -r .github/requirements-build.txt'
    - name: Build complete candidate assets
      env:
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_CHANNEL: ${{ inputs.channel }}
      run: bash scripts/package-release.sh "$RELEASE_VERSION" "$RELEASE_CHANNEL"
    - name: Download native AMD64 image and build receipt
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: native-container-amd64-${{ github.run_attempt }}
        path: native-inputs/amd64
    - name: Download native ARM64 image and build receipt
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: native-container-arm64-${{ github.run_attempt }}
        path: native-inputs/arm64
    - name: Assemble the verified multi-platform OCI archive
      run: bash scripts/package-container.sh
    - name: Verify all packaged checksums
      working-directory: release-dist
      run: sha256sum --check SHA256SUMS
    - name: Verify and stage versioned release assets
      shell: bash
      env:
        RELEASE_ASSET_TARGET: package
        RELEASE_ASSET_PATTERN_0: release-dist/*
      run: python3 scripts/stage_release_assets.py --target "$RELEASE_ASSET_TARGET" --pattern "$RELEASE_ASSET_PATTERN_0"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-assets
        path: release-assets/package/*
        if-no-files-found: error
        retention-days: 30
