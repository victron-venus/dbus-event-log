name: Release Security
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security:
    name: Release Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install Bandit
        run: >-
          python -m pip install --only-binary=:all: bandit==1.9.2
      - name: Block high severity Python findings
        run: python -m bandit -r . -lll -x .git,.venv,.venv-ci,tests,release-dist,dist,build -f json -o bandit-results.json
      - name: Block high and critical dependency and secret findings
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: .git,.venv,.venv-ci,release-dist,dist,build
      - name: Retain security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-bandit-results
          path: bandit-results.json
          if-no-files-found: error
