# Bound container output independently from SQLite event retention.
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  dbus-event-log:
    build: .
    container_name: dbus-event-log
    restart: "no"
    command: ["monitor", "--duration", "900"]
    stop_grace_period: 60s
    logging: *bounded-logging
    volumes:
      - dbus-event-log-data:/var/lib/dbus-event-log
      - /var/run/dbus:/var/run/dbus:ro
    environment:
      - DBUS_EVENT_LOG_STORAGE_BACKEND=sqlite
      - DBUS_EVENT_LOG_STORAGE_SQLITE_PATH=/var/lib/dbus-event-log/events.db
      - DBUS_EVENT_LOG_MQTT_HOST=mosquitto
      - DBUS_EVENT_LOG_MQTT_ENABLED=true
      - DBUS_EVENT_LOG_LOG_LEVEL=INFO
    depends_on:
      - mosquitto

  # Optional: TimescaleDB backend
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    container_name: dbus-event-log-timescaledb
    restart: "no"
    logging: *bounded-logging
    environment:
      - POSTGRES_DB=dbus_events
      - POSTGRES_USER=dbus_event_log
      # Empty by default: PostgreSQL refuses first initialization until supplied.
      - POSTGRES_PASSWORD=${TIMESCALEDB_PASSWORD:-}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    profiles:
      - timescaledb

  # MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: dbus-event-log-mosquitto
    restart: "no"
    logging: *bounded-logging
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:9001:9001"
    volumes:
      - mosquitto-data:/mosquitto/data
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  dbus-event-log-data:
  timescaledb-data:
  mosquitto-data:
