[project]
name = "dbus-event-log"
version = "0.1.0"
description = "Audit log of all D-Bus commands and inverter state transitions with chronology, filtering, and export"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Victron Energy", email = "software@victronenergy.com"}
]
keywords = ["dbus", "audit", "logging", "inverter", "mqtt", "sqlite", "timescaledb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pydbus>=0.6.0",
    "paho-mqtt>=2.0.0",
    "sqlite-utils>=3.37.0",
    "click>=8.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.9.0",
    "rich>=13.7.0",
    "csvkit>=1.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "types-PyYAML>=6.0.0",
    "types-python-dateutil>=2.9.0",
]
timescaledb = [
    "asyncpg>=0.29.0",
    "psycopg[pool]>=3.2.0",
]

[project.scripts]
dbus-event-log = "dbus_event_log.cli:main"

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C4", "N", "D", "T20", "SIM", "RET"]
ignore = ["D100", "D102", "D104", "D401"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
strict = true

# Missing stubs for optional/3rd-party dependencies
[[tool.mypy.overrides]]
module = [
    "pydbus",
    "asyncpg",
    "pythonjsonlogger",
    "pythonjsonlogger.jsonlogger",
    "yaml",
    "dateutil",
    "dateutil.parser",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["src"]

[tool.pylint.MASTER]
disable = [
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0903",  # too-few-public-methods
    "W0212",  # protected-access (tests intentionally inspect internals)
    "C0413",  # wrong-import-position (TYPE_CHECKING guards must be after stdlib)
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise AssertionError", "raise NotImplementedError"]
